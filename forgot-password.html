<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style-forgot-password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-image">
            <img src="assets/index/Rectangle289-2.png" alt="289-2">
        </div>
        <div class="right-content">
            <div class="logo">
                <img src="assets/index/Frame12.png" alt="logo">
            </div>
            <h2>Fill out the form correctly</h2>
            <p class="desc">We will send new password to your email</p>
            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <img src="assets/index/mail.png" class="input-icon" alt="mail">
                    <input type="email" id="input-email" placeholder="Enter Your Email">
                </div>
            </div>
            <button class="btn-submit">Submit</button>
        </div>
    </div>

    <script>
        const inputEmail = document.getElementById("input-email")
        const btnSubmit = document.querySelector(".btn-submit")

         btnSubmit.addEventListener("click", function () {
        const email = inputEmail.value.trim()

        if (email === "") {
            alert("Email tidak boleh kosong")
            inputEmail.focus()
            return
        }
        
        if (email.includes(" ")) {
            alert("Format email tidak valid");
            inputEmail.focus();
            return;
        }

        alert("Email valid")
        
    });

    </script>
</body>
</html>
