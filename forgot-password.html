<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style-forgot-password.css">
</head>
<body>
    <div class="container">
        <div class="left-image">
            <img src="assets/index/Rectangle289-2.png" alt="289-2">
        </div>
        <div class="right-content">
            <div class="logo">
                <img src="assets/index/Frame12.png" alt="logo">
            </div>
            <h2>Fill out the form correctly</h2>
            <p class="desc">We will send new password to your email</p>
            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <img src="assets/index/mail.png" class="input-icon" alt="mail">
                    <input type="text" placeholder="Enter Your Email">
                </div>
            </div>
            <button class="btn-submit">Submit</button>
        </div>
    </div>
</body>
</html>
