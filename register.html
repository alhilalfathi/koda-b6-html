<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styleRegister.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
</head>
<body>
    <section>
        <div class="container">
            <div class="left-div">
                <img src="assets/index/Rectangle289.png" alt="bannerImage">
            </div>
            <div class="right-div">
                <div class="logo">
                    <img src="assets/index/Frame12.png" alt="logo">
                </div>
                <h2>Register</h2>
                <p>Fill out the form correctly</p>
                <div class="input">
                    <label>Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter Your Full Name">
                </div>
                <div class="input">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter Your Email">
                </div>
                <div class="input">
                    <label>Password</label>
                    <input type="Password" id="password" placeholder="Enter Your Password">
                </div>
                <div class="input">
                    <label>Confirm Password</label>
                    <input type="Password" id="confirmPassword" placeholder="Enter Your Password Again">
                </div>
                <button class="btn-register" id="btnRegister" >Register</button>
                <div class="login-text">
                    Have An Account? <span>Login</span>
                </div>
                <div class="divider">Or</div>
                <div class="social">
                <div class="social-btn">
                    <img src="assets/index/bx_bxl-facebook-circle.png" alt="fb">
                    Facebook
                </div>
                <div class="social-btn">
                    <img src="assets/index/flat-color-icons_google.png" alt="google">
                    Google
                </div>
            </div>
            </div>
        </div>
    </section>

    <script>
        const fullname = document.getElementById("fullname")
        const email = document.getElementById("email")
        const password = document.getElementById("password")
        const confirmPassword = document.getElementById("confirmPassword")
        const btnRegister = document.getElementById("btnRegister")

        btnRegister.addEventListener("click", ()=>{
            if (
                fullname.value === "" || email.value === "" || password.value === "" || confirmPassword.value === "") {
                alert("Semua field wajib diisi!")
                return
            }

            if (!email.value.includes("@")) {
                alert("Email tidak valid!")
                return
            }

            if (password.value.length < 8) {
                alert("Password minimal 8 karakter!")
                return
            }

            if (password.value !== confirmPassword.value) {
                alert("Password dan Confirm Password tidak sama!")
                return
            }

            alert("Register berhasil")
        })
    </script>
    
</body>
</html>
