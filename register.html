<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styleIndex.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
</head>
<body>
    <main>
        <div class="container">
            <!-- side image  -->
            <aside class="left-image">
                <img src="assets/index/Rectangle289.png" alt="banner-image">
            </aside>
            <!-- content  -->
            <article class="right-content">
                <div class="logo">
                    <img src="assets/index/Frame12.png" alt="logo">
                </div>
                <h2 class="login-title" >Register</h2>
                <p class="subtitle" >Fill out the form correctly</p>
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <img src="assets/index/Profile.png" alt="fullname-icon" class="input-icon">
                        <input type="text" id="fullname" placeholder="Enter Your Full Name">
                    </div>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <img src="assets/index/mail.png" alt="email-icon" class="input-icon">
                        <input type="email" id="email" placeholder="Enter Your Email">
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <img src="assets/index/Password.png" alt="password-icon" class="input-icon">
                        <input type="password" id="password" placeholder="Enter Your Password">
                        <img src="assets/index/EyeSlash.png" alt="eye-icon" class="eye-icon">
                    </div>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <img src="assets/index/Password.png" alt="password-icon" class="input-icon">
                        <input type="password" id="confirmPassword" placeholder="Enter Your Password Again">
                        <img src="assets/index/EyeSlash.png" alt="eye-icon" class="eye-icon2">
                    </div>
                </div>
                <button class="btn-register" id="btnRegister" >Register</button>
                <div class="login-text">
                    Have An Account? <a href="login.html">Login</a>
                </div>
                <div class="divider">Or</div>
                <div class="social">
                <div class="social-btn">
                    <img src="assets/index/bx_bxl-facebook-circle.png" alt="facebook-image">
                    Facebook
                </div>
                <div class="social-btn">
                    <img src="assets/index/flat-color-icons_google.png" alt="google-image">
                    Google
                </div>
                </div>
            </article>
        </div>
    </main>

    <script>
        const fullname = document.getElementById("fullname")
        const email = document.getElementById("email")
        const password = document.getElementById("password")
        const confirmPassword = document.getElementById("confirmPassword")
        const btnRegister = document.getElementById("btnRegister")
        const eyeicon = document.querySelector(".eye-icon")
        const eyeicon2 = document.querySelector(".eye-icon2")

        eyeicon.addEventListener("click",()=>{
            if (password.type === "password"){
                password.type = "text"
            }else {
                password.type = "password"
            }
            
        })
         eyeicon2.addEventListener("click",()=>{
            if (confirmPassword.type === "password"){
                confirmPassword.type = "text"
            }else {
                confirmPassword.type = "password"
            }
            
        })
        

        btnRegister.addEventListener("click", ()=>{
            if (
                fullname.value === "" || email.value === "" || password.value === "" || confirmPassword.value === "") {
                alert("Semua field wajib diisi!")
                return
            }

            if (!email.value.includes("@")) {
                alert("Email tidak valid!")
                return
            }

            if (password.value.length < 8) {
                alert("Password minimal 8 karakter!")
                return
            }

            if (password.value !== confirmPassword.value) {
                alert("Password dan Confirm Password tidak sama!")
                return
            }

            const users = JSON.parse(localStorage.getItem("users")) || []

            const userMail = users.find(user => user.email === email.value)
            if (userMail) {
                alert("Email sudah terdaftar!")
                return
            }

            const newUser = {
                fullname: fullname.value,
                email: email.value,
                password: password.value
            }

            users.push(newUser)
            localStorage.setItem("users", JSON.stringify(users))
            alert("Register berhasil!")
            window.location.href = "login.html"

        })
    </script>
    
</body>
</html>
