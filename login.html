<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styleIndex.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-image">
            <img src="assets/index/Rectangle289-1.png" alt="coffe-img">
        </div>
        <div class="right-content">
            <div class="logo">
                <img src="assets/index/Frame12.png" alt="logo">
            </div>
            <h2 class="login-title">Login</h2>
            <p class="subtitle">Fill out the form correctly</p>
            <div class="input-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <img src="assets/index/mail.png" alt="email icon" class="input-icon">
                    <input type="email" id="input-email" placeholder="Enter Your Email">
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <img src="assets/index/Password.png" alt="password icon" class="input-icon">
                    <input type="password" id="input-password" placeholder="Enter Your Password">
                    <img src="assets/index/EyeSlash.png" alt="eye icon" class="eye-icon">
                </div>
            </div>
            <div class="forgotpass-wrapper"><a href="/forgot-password.html" class="forgot">Lupa Password?</a></div>
            <button class="btn-login">Login</button>
            <p class="register-text">Not Have An Account? <a href="register.html">Register</a></p>
            <div class="divider">Or</div>
            <div class="social">
                <div class="social-btn">
                    <img src="assets/index/bx_bxl-facebook-circle.png" alt="fb">
                    Facebook
                </div>
                <div class="social-btn">
                    <img src="assets/index/flat-color-icons_google.png" alt="google">
                    Google
                </div>
            </div>
        </div>
    </div>

    <script>
    
        const btnLogin = document.querySelector(".btn-login")
        const inputEmail = document.getElementById("input-email")
        const inputPassword = document.getElementById("input-password")
        const eyeicon = document.querySelector(".eye-icon")

        eyeicon.addEventListener("click",()=>{
            if (inputPassword.type === "password"){
                inputPassword.type = "text"
            }else {
                inputPassword.type = "password"
            }
            
        })

        btnLogin.addEventListener("click",()=> {
            const email = inputEmail.value
            const password = inputPassword.value

            if (email === "" || password === "") {
            alert("Email dan Password wajib diisi!")
            return
            }

            const users = JSON.parse(localStorage.getItem("users")) || []

            const user = users.find(user => user.email === email && user.password === password)

            if (!user) {
                alert("Email atau Password salah!")
                return
            }

            localStorage.setItem("userNow", JSON.stringify(user))
            alert("Login berhasil!")
            window.location.href = "index.html"
        })
    
    </script>
</body>
</html>
